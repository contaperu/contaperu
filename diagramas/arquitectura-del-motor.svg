<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="824" viewBox="0 0 680 824" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">ContaPerú por dentro: del ERP externo a los destinos</title>
<desc id="descripcion">El contador sube al ERP externo los XML de las facturas o el TXT de la propuesta del SIRE. El ERP externo guarda, revisa y descarga. Le pasa al motor el documento común open-accounting, con el libro y los comprobantes; la imputación de cuentas y centros llega aparte. El motor, sin red, sin disco y sin estado, entra por sus puertas —Python, CLI, MCP y HTTP— a la API pública 1.0. El pipeline lee, prepara, arma y diagnostica apoyándose en el núcleo peruano, que valida, calcula el IGV, arma el asiento y aplica el PCGE, y los drivers lo traducen al destino sin decidir cuentas: el TXT del SIRE, los asientos de CONCAR, el registro de CONTASIS o de vuelta al ERP en JSON, con su diagnóstico.</desc>
