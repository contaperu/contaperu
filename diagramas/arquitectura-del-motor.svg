<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">El motor ContaPerú por dentro</title>
<desc id="descripcion">Cuatro formas de usar el motor —librería Python, CLI, MCP y HTTP con el contrato OpenConta— entran por la API pública 1.0. Debajo, el pipeline lee, prepara, arma y diagnostica apoyándose en el núcleo peruano. Los drivers, con el contrato v1 y su kit, entregan a CONCAR, CONTASIS, el SIRE y el CSV, y a drivers de terceros.</desc>
<style>
.fondo{fill:#FFFFFF}
.t,.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .t{fill:#444441}.g .s{fill:#5F5E5A}
.v rect{fill:#E1F5EE;stroke:#0F6E56}.v .t{fill:#085041}.v .s{fill:#0F6E56}
.m rect{fill:#EEEDFE;stroke:#534AB7}.m .t{fill:#3C3489}.m .s{fill:#534AB7}
.flecha{stroke:#888780;stroke-width:1.5;fill:none}
.leyenda{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.fondo{fill:#0D1117}
.g rect{fill:#444441;stroke:#B4B2A9}.g .t{fill:#F1EFE8}.g .s{fill:#D3D1C7}
.v rect{fill:#085041;stroke:#5DCAA5}.v .t{fill:#E1F5EE}.v .s{fill:#9FE1CB}
.m rect{fill:#3C3489;stroke:#AFA9EC}.m .t{fill:#EEEDFE}.m .s{fill:#CECBF6}
.leyenda{fill:#B4B2A9}
}
</style>
<defs>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect class="fondo" x="0" y="0" width="680" height="510" rx="12"/>
<g class="m"><rect x="44" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="112" y="60">Python</text><text class="s" x="112" y="78">Importa la API</text></g>
<g class="m"><rect x="196" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="264" y="60">CLI</text><text class="s" x="264" y="78">Por lotes</text></g>
<g class="m"><rect x="348" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="416" y="60">MCP</text><text class="s" x="416" y="78">Agentes de IA</text></g>
<g class="m"><rect x="500" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="568" y="60">HTTP</text><text class="s" x="568" y="78">OpenConta</text></g>
<line class="flecha" x1="112" y1="98" x2="112" y2="130" marker-end="url(#punta)"/>
<line class="flecha" x1="264" y1="98" x2="264" y2="130" marker-end="url(#punta)"/>
<line class="flecha" x1="416" y1="98" x2="416" y2="130" marker-end="url(#punta)"/>
<line class="flecha" x1="568" y1="98" x2="568" y2="130" marker-end="url(#punta)"/>
<g class="m"><rect x="60" y="132" width="560" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="152">API pública 1.0</text><text class="s" x="340" y="170">Operaciones, esquemas y errores</text></g>
<line class="flecha" x1="195" y1="190" x2="195" y2="222" marker-end="url(#punta)"/>
<g class="v"><rect x="60" y="224" width="270" height="56" rx="8" stroke-width="0.5"/><text class="t" x="195" y="244">Pipeline</text><text class="s" x="195" y="262">Lee, prepara, arma, diagnostica</text></g>
<line class="flecha" x1="332" y1="252" x2="348" y2="252" marker-end="url(#punta)"/>
<g class="v"><rect x="350" y="224" width="270" height="56" rx="8" stroke-width="0.5"/><text class="t" x="485" y="244">Núcleo peruano</text><text class="s" x="485" y="262">Valida, IGV, asiento, PCGE</text></g>
<line class="flecha" x1="195" y1="282" x2="195" y2="314" marker-end="url(#punta)"/>
<g class="v"><rect x="60" y="316" width="560" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="336">Drivers: contrato v1 y kit</text><text class="s" x="340" y="354">Cada driver dice a quién entrega</text></g>
<line class="flecha" x1="112" y1="374" x2="112" y2="406" marker-end="url(#punta)"/>
<line class="flecha" x1="264" y1="374" x2="264" y2="406" marker-end="url(#punta)"/>
<line class="flecha" x1="416" y1="374" x2="416" y2="406" marker-end="url(#punta)"/>
<line class="flecha" x1="568" y1="374" x2="568" y2="406" marker-end="url(#punta)"/>
<g class="g"><rect x="44" y="408" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="112" y="428">CONCAR</text><text class="s" x="112" y="446">Asientos</text></g>
<g class="g"><rect x="196" y="408" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="264" y="428">CONTASIS</text><text class="s" x="264" y="446">Registro</text></g>
<g class="g"><rect x="348" y="408" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="416" y="428">SIRE y CSV</text><text class="s" x="416" y="446">TXT y columnas</text></g>
<g class="g"><rect x="500" y="408" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="568" y="428">De terceros</text><text class="s" x="568" y="446">Paquete propio</text></g>
<text class="s leyenda" x="340" y="492">Morado: lo que ve quien integra · verde azulado: por dentro · gris: destinos</text>
</svg>
