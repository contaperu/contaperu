<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">ContaPerú por dentro: del ERP externo a los destinos</title>
<desc id="descripcion">El contador sube XML, PDF, fotos o TXT al ERP externo y, próximamente, un sistema facturador le avisa al emitir. El ERP externo guarda, revisa y descarga, y su IA lee los PDF y las fotos. Le pasa al motor el documento común open-accounting: libro, comprobantes e imputación. El motor, sin red, sin disco y sin estado, entra por sus puertas —Python, CLI, MCP y HTTP—, valida y arma el asiento en el núcleo, y sus drivers lo traducen al TXT del SIRE, a los asientos de CONCAR, al registro de CONTASIS o de vuelta al ERP en JSON, con su diagnóstico.</desc>
