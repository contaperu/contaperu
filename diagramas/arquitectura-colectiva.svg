<text class="s leyenda" x="340" y="470">Arquitectura colectiva: una base abierta para todos</text>
<text class="s leyenda" x="340" y="492">Morado: la comunidad · azul: el estándar · verde azulado: el motor · gris: entradas y destinos</text>
