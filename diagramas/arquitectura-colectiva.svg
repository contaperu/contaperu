<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="516" viewBox="0 0 680 516" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Arquitectura colectiva: una base abierta para la contabilidad automatizada</title>
<desc id="descripcion">Los comprobantes electrónicos de SUNAT en XML y la propuesta del SIRE, que trae todos los comprobantes del contribuyente, entran a un estándar abierto, open-accounting. De ahí pasan al motor, al que la comunidad abierta aporta y mejora. El motor entrega a tres grupos de destinos: el SIRE, con el TXT de reemplazo del RVIE y del RCE; los sistemas legacy, CONCAR y CONTASIS, con STARSOFT como próximo; y los ERP que vienen, con JSON, CSV y HTTP. Es una arquitectura colectiva: una base abierta para todos.</desc>
