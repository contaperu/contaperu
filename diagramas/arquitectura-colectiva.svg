.fondo{fill:#FFFFFF}
.t,.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
.grande{font-size:20px;font-weight:600}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .t{fill:#444441}.g .s{fill:#5F5E5A}
.v rect{fill:#E1F5EE;stroke:#0F6E56}.v .t{fill:#085041}.v .s{fill:#0F6E56}
.m rect{fill:#EEEDFE;stroke:#534AB7}.m .t{fill:#3C3489}.m .s{fill:#534AB7}
.a rect{fill:#E6F1FB;stroke:#185FA5}.a .t{fill:#0C447C}.a .s{fill:#185FA5}
.flecha{stroke:#888780;stroke-width:1.5;fill:none}
.leyenda{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.fondo{fill:#0D1117}
.g rect{fill:#444441;stroke:#B4B2A9}.g .t{fill:#F1EFE8}.g .s{fill:#D3D1C7}
.v rect{fill:#085041;stroke:#5DCAA5}.v .t{fill:#E1F5EE}.v .s{fill:#9FE1CB}
.m rect{fill:#3C3489;stroke:#AFA9EC}.m .t{fill:#EEEDFE}.m .s{fill:#CECBF6}
.a rect{fill:#0C447C;stroke:#85B7EB}.a .t{fill:#E6F1FB}.a .s{fill:#B5D4F4}
.leyenda{fill:#B4B2A9}
}
</style>
