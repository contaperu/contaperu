<g class="a"><rect x="444" y="24" width="90" height="56" rx="8" stroke-width="0.5"/><text class="t" x="489" y="52">asiento</text></g>
<g class="a"><rect x="562" y="24" width="78" height="56" rx="8" stroke-width="0.5"/><text class="t" x="601" y="52">drivers</text></g>

