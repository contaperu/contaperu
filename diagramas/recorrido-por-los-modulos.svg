<g class="m"><rect x="40" y="304" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="322">pipeline</text><text class="s" x="340" y="340">Orquesta todo lo anterior</text></g>
<g class="m"><rect x="40" y="364" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="382">API pública</text><text class="s" x="340" y="400">La expone, y congela cada nombre con su firma</text></g>
<g class="m"><rect x="40" y="424" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="442">Puertas</text><text class="s" x="340" y="460">CLI, MCP y HTTP: solo hablan con la API</text></g>
</svg>
