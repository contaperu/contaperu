<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="778" viewBox="0 0 680 778" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Qué carpeta y qué archivo toca un comprobante, de punta a punta</title>
<desc id="descripcion">El recorrido de un comprobante por el paquete, carpeta a carpeta. Entra por lectores, con xml_ubl, sire_txt, archivos y zip. Pasa al modelo canónico y su vocabulario: modelo, vocabulario y catalogos, que leen los catálogos de datos de SUNAT con su fuente. Lo revisan las reglas deterministas: validar, igv, detracciones y configuracion. La carpeta asiento arma la partida doble con motor, lineas, resolucion, indice, imputacion, huella, faltas y su configuracion, apoyándose en partida_doble, que comprueba que el Debe iguale al Haber, y en pcge. Los drivers lo traducen sin decidir cuentas: contrato y kit, y los seis destinos concar, contasis, sire, csv, starsoft y asiento_neutral; comparar_sire contrasta lo generado con lo que SUNAT ya tiene. Por debajo, pipeline orquesta todo lo anterior con lectura, preparacion, seleccion, armado, diagnostico y salida; api expone la superficie pública congelada con operaciones, tabla, documento, errores, openconta y esquemas; y puertas, que solo hablan con api, ofrece cli, servidor MCP y servidor HTTP. Al final, los módulos de servicio del paquete.</desc>
