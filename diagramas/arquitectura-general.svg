<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="436" viewBox="0 0 680 436" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Los tres caminos de ContaPerú dentro de un ERP externo</title>
<desc id="descripcion">Tres caminos atraviesan un ERP externo que lleva el motor dentro y tiene su propia IA para leer los PDF y las fotos. Las facturas en XML, PDF o imagen se leen y validan —el motor lee el XML y los datos que sacó la IA del ERP— y salen como TXT del SIRE. La propuesta del SIRE, el TXT de SUNAT, se convierte en asientos o en registro para CONCAR o CONTASIS. Próximamente, el aviso de un sistema facturador al emitir llega al ERP externo, y el motor lo convierte al estándar común para otro ERP. Cualquier carga puede terminar en las tres salidas, y el motor no guarda nada: el ERP externo guarda, revisa y descarga.</desc>
<style>
.fondo{fill:#FFFFFF}
.t,.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .t{fill:#444441}.g .s{fill:#5F5E5A}
.v rect{fill:#E1F5EE;stroke:#0F6E56}.v .t{fill:#085041}.v .s{fill:#0F6E56}
.m rect{fill:#EEEDFE;stroke:#534AB7}.m .t{fill:#3C3489}.m .s{fill:#534AB7}
.flecha{stroke:#888780;stroke-width:1.5;fill:none}
.leyenda{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.fondo{fill:#0D1117}
.g rect{fill:#444441;stroke:#B4B2A9}.g .t{fill:#F1EFE8}.g .s{fill:#D3D1C7}
.v rect{fill:#085041;stroke:#5DCAA5}.v .t{fill:#E1F5EE}.v .s{fill:#9FE1CB}
.m rect{fill:#3C3489;stroke:#AFA9EC}.m .t{fill:#EEEDFE}.m .s{fill:#CECBF6}
.leyenda{fill:#B4B2A9}
}
</style>
<defs>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect class="fondo" x="0" y="0" width="680" height="436" rx="12"/>
<g class="m"><rect x="236" y="20" width="208" height="342" rx="16" stroke-width="0.5"/><text class="t" x="340" y="44">ERP externo</text><text class="s" x="340" y="62">Con el motor dentro</text><text class="s" x="340" y="80">Su IA lee PDF y fotos</text></g>
<g class="g"><rect x="16" y="106" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="96" y="124">Facturas</text><text class="s" x="96" y="142">XML, PDF e imágenes</text></g>
<g class="g"><rect x="16" y="198" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="96" y="216">Propuesta SIRE</text><text class="s" x="96" y="234">TXT de SUNAT</text></g>
<g class="g"><rect x="16" y="290" width="160" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="t" x="96" y="308">Facturador</text><text class="s" x="96" y="326">Avisa al emitir</text></g>
<g class="v"><rect x="252" y="106" width="176" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="124">Lee y valida</text><text class="s" x="340" y="142">XML y datos de la IA</text></g>
<g class="v"><rect x="252" y="198" width="176" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="216">Arma el asiento</text><text class="s" x="340" y="234">Desde el TXT del SIRE</text></g>
<g class="v"><rect x="252" y="290" width="176" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="t" x="340" y="308">Lo convierte</text><text class="s" x="340" y="326">Al estándar común</text></g>
<g class="g"><rect x="504" y="106" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="584" y="124">TXT del SIRE</text><text class="s" x="584" y="142">Listo para subir</text></g>
<g class="g"><rect x="504" y="198" width="160" height="56" rx="8" stroke-width="0.5"/><text class="t" x="584" y="216">CONCAR o CONTASIS</text><text class="s" x="584" y="234">Asientos o registro</text></g>
<g class="g"><rect x="504" y="290" width="160" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="t" x="584" y="308">Otro ERP</text><text class="s" x="584" y="326">Documento estándar</text></g>
<line class="flecha" x1="178" y1="134" x2="250" y2="134" marker-end="url(#punta)"/>
<line class="flecha" x1="430" y1="134" x2="502" y2="134" marker-end="url(#punta)"/>
<line class="flecha" x1="178" y1="226" x2="250" y2="226" marker-end="url(#punta)"/>
<line class="flecha" x1="430" y1="226" x2="502" y2="226" marker-end="url(#punta)"/>
<line class="flecha" x1="178" y1="318" x2="250" y2="318" stroke-dasharray="4 3" marker-end="url(#punta)"/>
<line class="flecha" x1="430" y1="318" x2="502" y2="318" stroke-dasharray="4 3" marker-end="url(#punta)"/>
<text class="s leyenda" x="340" y="390">Punteado: próximo · cualquier carga puede terminar en las tres salidas</text>
<text class="s leyenda" x="340" y="412">El motor no guarda nada: el ERP externo guarda, revisa y descarga</text>
</svg>
