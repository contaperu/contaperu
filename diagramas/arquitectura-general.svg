<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Dos entradas y un documento común dentro de un ERP externo</title>
<desc id="descripcion">Un ERP externo lleva el motor dentro y recibe dos entradas: las facturas en XML de SUNAT y la propuesta del SIRE, el TXT que ya trae todos los comprobantes del contribuyente. El motor las lee y valida, y las dos llegan al documento común open-accounting. De ese documento salen el TXT del SIRE listo para subir, los asientos o el registro para CONCAR o CONTASIS, y el documento en JSON con su diagnóstico para otro ERP. Cualquier entrada puede terminar en las tres salidas, y el motor no guarda nada: el ERP externo guarda, revisa y descarga.</desc>
<style>
.fondo{fill:#FFFFFF}
.t,.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .t{fill:#444441}.g .s{fill:#5F5E5A}
.v rect{fill:#E1F5EE;stroke:#0F6E56}.v .t{fill:#085041}.v .s{fill:#0F6E56}
.m rect{fill:#EEEDFE;stroke:#534AB7}.m .t{fill:#3C3489}.m .s{fill:#534AB7}
.a rect{fill:#E6F1FB;stroke:#185FA5}.a .t{fill:#0C447C}.a .s{fill:#185FA5}
.flecha{stroke:#888780;stroke-width:1.5;fill:none}
.leyenda{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.fondo{fill:#0D1117}
.g rect{fill:#444441;stroke:#B4B2A9}.g .t{fill:#F1EFE8}.g .s{fill:#D3D1C7}
.v rect{fill:#085041;stroke:#5DCAA5}.v .t{fill:#E1F5EE}.v .s{fill:#9FE1CB}
.m rect{fill:#3C3489;stroke:#AFA9EC}.m .t{fill:#EEEDFE}.m .s{fill:#CECBF6}
.a rect{fill:#0C447C;stroke:#85B7EB}.a .t{fill:#E6F1FB}.a .s{fill:#B5D4F4}
.leyenda{fill:#B4B2A9}
}
</style>
<defs>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect class="fondo" x="0" y="0" width="680" height="470" rx="12"/>
<g class="m"><rect x="190" y="20" width="270" height="296" rx="16" stroke-width="0.5"/><text class="t" x="325" y="44">ERP externo</text><text class="s" x="325" y="62">Con el motor dentro</text></g>
<g class="g"><rect x="16" y="76" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="91" y="94">Facturas</text><text class="s" x="91" y="112">XML de SUNAT</text></g>
<g class="g"><rect x="16" y="156" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="91" y="174">Propuesta SIRE</text><text class="s" x="91" y="192">Todos los comprobantes</text></g>
<g class="v"><rect x="206" y="90" width="238" height="108" rx="8" stroke-width="0.5"/><text class="t" x="325" y="135">Lee y valida</text><text class="s" x="325" y="153">XML y TXT del SIRE</text></g>
<g class="a"><rect x="206" y="226" width="238" height="56" rx="8" stroke-width="0.5"/><text class="t" x="325" y="244">open-accounting</text><text class="s" x="325" y="262">El documento común</text></g>
<g class="g"><rect x="514" y="112" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="589" y="130">TXT del SIRE</text><text class="s" x="589" y="148">Listo para subir</text></g>
<g class="g"><rect x="514" y="226" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="589" y="244">CONCAR o CONTASIS</text><text class="s" x="589" y="262">Asientos o registro</text></g>
<g class="g"><rect x="514" y="340" width="150" height="56" rx="8" stroke-width="0.5"/><text class="t" x="589" y="358">Otro ERP</text><text class="s" x="589" y="376">JSON y diagnóstico</text></g>
<line class="flecha" x1="168" y1="104" x2="204" y2="104" marker-end="url(#punta)"/>
<line class="flecha" x1="168" y1="184" x2="204" y2="184" marker-end="url(#punta)"/>
<line class="flecha" x1="325" y1="200" x2="325" y2="224" marker-end="url(#punta)"/>
<line class="flecha" x1="446" y1="254" x2="512" y2="254" marker-end="url(#punta)"/>
<path class="flecha" d="M487 254V140H512" marker-end="url(#punta)"/>
<path class="flecha" d="M487 254V368H512" marker-end="url(#punta)"/>
<text class="s leyenda" x="340" y="424">Cualquier entrada puede terminar en las tres salidas</text>
<text class="s leyenda" x="340" y="446">El motor no guarda nada: el ERP externo guarda, revisa y descarga</text>
</svg>
