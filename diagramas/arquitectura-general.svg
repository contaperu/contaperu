<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Arquitectura de ContaPerú: entradas, estándar, motor y destinos</title>
<desc id="descripcion">SUNAT, el ERP de la empresa, los PDF y fotos, y en el futuro el banco, entregan información que se convierte en el documento común open-accounting. El motor ContaPerú lo recibe por sus puertas, el núcleo valida y arma el asiento, y los drivers lo traducen a CONCAR, CONTASIS, el SIRE o de vuelta a un ERP y a agentes de IA.</desc>
<style>
.fondo{fill:#FFFFFF}
.t,.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .t{fill:#444441}.g .s{fill:#5F5E5A}
.v rect{fill:#E1F5EE;stroke:#0F6E56}.v .t{fill:#085041}.v .s{fill:#0F6E56}
.m rect{fill:#EEEDFE;stroke:#534AB7}.m .t{fill:#3C3489}.m .s{fill:#534AB7}
.caja rect{fill:#FFFFFF;stroke:#B4B2A9}.caja .t{fill:#2C2C2A}.caja .s{fill:#5F5E5A}
.flecha{stroke:#888780;stroke-width:1.5;fill:none}
.leyenda{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.fondo{fill:#0D1117}
.g rect{fill:#444441;stroke:#B4B2A9}.g .t{fill:#F1EFE8}.g .s{fill:#D3D1C7}
.v rect{fill:#085041;stroke:#5DCAA5}.v .t{fill:#E1F5EE}.v .s{fill:#9FE1CB}
.m rect{fill:#3C3489;stroke:#AFA9EC}.m .t{fill:#EEEDFE}.m .s{fill:#CECBF6}
.caja rect{fill:#161B22;stroke:#888780}.caja .t{fill:#F1EFE8}.caja .s{fill:#D3D1C7}
.leyenda{fill:#B4B2A9}
}
</style>
<defs>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect class="fondo" x="0" y="0" width="680" height="510" rx="12"/>
<g class="g"><rect x="44" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="112" y="60">SUNAT</text><text class="s" x="112" y="78">XML y SIRE</text></g>
<g class="g"><rect x="196" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="264" y="60">Tu ERP</text><text class="s" x="264" y="78">Manda su JSON</text></g>
<g class="g"><rect x="348" y="40" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="416" y="60">PDF y fotos</text><text class="s" x="416" y="78">Los lee la IA</text></g>
<g class="g"><rect x="500" y="40" width="136" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="t" x="568" y="60">Banco</text><text class="s" x="568" y="78">Próximo</text></g>
<line class="flecha" x1="112" y1="98" x2="112" y2="130" marker-end="url(#punta)"/>
<line class="flecha" x1="264" y1="98" x2="264" y2="130" marker-end="url(#punta)"/>
<line class="flecha" x1="416" y1="98" x2="416" y2="130" marker-end="url(#punta)"/>
<line class="flecha" x1="568" y1="98" x2="568" y2="130" stroke-dasharray="4 3" marker-end="url(#punta)"/>
<g class="v"><rect x="60" y="132" width="560" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="152">open-accounting, el documento común</text><text class="s" x="340" y="170">Libro, comprobantes y asiento</text></g>
<line class="flecha" x1="340" y1="190" x2="340" y2="222" marker-end="url(#punta)"/>
<g class="m"><rect x="40" y="224" width="600" height="144" rx="20" stroke-width="0.5"/><text class="t" x="340" y="246">ContaPerú, el motor</text><text class="s" x="340" y="264">Sin red, sin disco, sin estado</text></g>
<g class="caja"><rect x="60" y="284" width="172" height="64" rx="8" stroke-width="0.5"/><text class="t" x="146" y="306">Puertas</text><text class="s" x="146" y="326">CLI, MCP y HTTP</text></g>
<g class="caja"><rect x="254" y="284" width="172" height="64" rx="8" stroke-width="0.5"/><text class="t" x="340" y="306">Núcleo</text><text class="s" x="340" y="326">Valida y asienta</text></g>
<g class="caja"><rect x="448" y="284" width="172" height="64" rx="8" stroke-width="0.5"/><text class="t" x="534" y="306">Drivers</text><text class="s" x="534" y="326">Traducen al destino</text></g>
<line class="flecha" x1="234" y1="316" x2="252" y2="316" marker-end="url(#punta)"/>
<line class="flecha" x1="428" y1="316" x2="446" y2="316" marker-end="url(#punta)"/>
<line class="flecha" x1="112" y1="370" x2="112" y2="402" marker-end="url(#punta)"/>
<line class="flecha" x1="264" y1="370" x2="264" y2="402" marker-end="url(#punta)"/>
<line class="flecha" x1="416" y1="370" x2="416" y2="402" marker-end="url(#punta)"/>
<line class="flecha" x1="568" y1="370" x2="568" y2="402" marker-end="url(#punta)"/>
<g class="g"><rect x="44" y="404" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="112" y="424">CONCAR</text><text class="s" x="112" y="442">Asientos</text></g>
<g class="g"><rect x="196" y="404" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="264" y="424">CONTASIS</text><text class="s" x="264" y="442">Registro</text></g>
<g class="g"><rect x="348" y="404" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="416" y="424">SIRE</text><text class="s" x="416" y="442">TXT</text></g>
<g class="g"><rect x="500" y="404" width="136" height="56" rx="8" stroke-width="0.5"/><text class="t" x="568" y="424">ERP y agentes</text><text class="s" x="568" y="442">JSON por HTTP</text></g>
<text class="s leyenda" x="340" y="490">Gris: sistemas de fuera · verde azulado: el estándar · morado: el motor · punteado: próximo</text>
</svg>
