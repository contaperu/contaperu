<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="686" viewBox="0 0 680 686" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Las puertas y la API pública de ContaPerú</title>
<desc id="descripcion">Cuatro que llaman: un programa en Python, un contador en la consola, un asistente de IA y un ERP en cualquier lenguaje. Cada uno entra por su puerta, y las puertas solo traducen, no hacen contabilidad. Python usa contaperu.api y llama directo a la API. La CLI, contaperu, tiene los comandos generar, desde-json, diagnosticar, configuracion, comparar y verificar-driver. El MCP, contaperu-mcp, ofrece 11 herramientas y 6 recursos por stdio, HTTP o SSE, con archivos de hasta 4 MB. HTTP, contaperu-http, expone rutas como POST /v1/exportar y GET /openconta.json, responde 421 a un Host no declarado, corta en 10 MB y atiende 16 peticiones a la vez. Las cuatro llegan a la API pública 1.0, contaperu.api, que no cambia de nombres ni de firmas hasta la 2.0: las operaciones como leer_xml, revisar, diagnosticar, generar_asiento y exportar; errores con clave estable, como sin_cuenta, no_cabe o sin_sigla, que HTTP entrega en RFC 9457; la tabla de operaciones, con la ruta HTTP y el nombre en el MCP de cada una; y OpenConta, el manual de la puerta HTTP en OpenAPI 3.1, generado desde la tabla. De la API, todo pedido entra al mismo pipeline, que se apoya en el núcleo peruano y termina en los drivers.</desc>
