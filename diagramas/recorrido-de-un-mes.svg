<g class="g"><rect x="245" y="548" width="190" height="72" rx="8" stroke-width="0.5"/><text class="t" x="340" y="568">5 · Registro contable</text><text class="s" x="340" y="588">Los comprobantes con</text><text class="s" x="340" y="604">las mismas cuentas</text></g>
<g class="g"><rect x="450" y="548" width="190" height="72" rx="8" stroke-width="0.5"/><text class="t" x="545" y="568">5 · Registro tributario</text><text class="s" x="545" y="588">Una línea por comprobante</text><text class="s" x="545" y="604">sin cuentas</text></g>
<line class="flecha" x1="135" y1="622" x2="135" y2="646" marker-end="url(#punta)"/>
<line class="flecha" x1="340" y1="622" x2="340" y2="646" marker-end="url(#punta)"/>
<line class="flecha" x1="545" y1="622" x2="545" y2="646" marker-end="url(#punta)"/>
<g class="g"><rect x="40" y="648" width="190" height="56" rx="8" stroke-width="0.5"/><text class="t" x="135" y="666">CONCAR y CSV</text><text class="s" x="135" y="684">Traducen cada línea</text></g>
<g class="g"><rect x="245" y="648" width="190" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="666">CONTASIS</text><text class="s" x="340" y="684">Su registro en Excel</text></g>
<g class="g"><rect x="450" y="648" width="190" height="56" rx="8" stroke-width="0.5"/><text class="t" x="545" y="666">SIRE</text><text class="s" x="545" y="684">El TXT y su ZIP</text></g>
<path class="flecha" d="M135 706V728H545V706"/>
<line class="flecha" x1="340" y1="706" x2="340" y2="750" marker-end="url(#punta)"/>
<g class="a"><rect x="40" y="752" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="770">6 · Responder</text><text class="s" x="340" y="788">El archivo, el resumen y cada comprobante con su identidad y su huella</text></g>
<text class="s leyenda" x="340" y="838">Verde: el núcleo peruano, que decide la contabilidad · gris: pipeline y drivers · azul: el documento</text>
<text class="s leyenda" x="340" y="860">revisar llega hasta 2 · diagnosticar recorre hasta 4 sin detenerse</text>
<text class="s leyenda" x="340" y="882">generar_asiento llega al asiento · exportar recorre todo</text>
</svg>
