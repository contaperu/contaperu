<g class="g"><rect x="350" y="20" width="290" height="56" rx="8" stroke-width="0.5"/><text class="t" x="495" y="38">Leer la propuesta del SIRE</text><text class="s" x="495" y="56">El TXT de SUNAT del periodo</text></g>
<line class="flecha" x1="185" y1="78" x2="185" y2="114" marker-end="url(#punta)"/>
<line class="flecha" x1="495" y1="78" x2="495" y2="114" marker-end="url(#punta)"/>
<g class="a"><rect x="40" y="116" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="134">open-accounting</text><text class="s" x="340" y="152">Libro y comprobantes · la configuración y la imputación llegan aparte</text></g>
<line class="flecha" x1="340" y1="174" x2="340" y2="198" marker-end="url(#punta)"/>
<g class="g"><rect x="40" y="200" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="218">1 · Preparar</text><text class="s" x="340" y="236">El libro, la configuración del destino y la imputación por id_externo</text></g>
<line class="flecha" x1="340" y1="258" x2="340" y2="282" marker-end="url(#punta)"/>
<g class="v"><rect x="40" y="284" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="302">2 · Revisar</text><text class="s" x="340" y="320">RUC, IGV, total, fecha y duplicados · un error detiene, un aviso pasa</text></g>
<line class="flecha" x1="340" y1="342" x2="340" y2="366" marker-end="url(#punta)"/>
