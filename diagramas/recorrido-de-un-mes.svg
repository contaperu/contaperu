<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="906" viewBox="0 0 680 906" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">El recorrido de un mes dentro del motor</title>
<desc id="descripcion">El motor lee el XML de las facturas, suelto o en ZIP y sin los CDR, o el TXT de la propuesta del SIRE, y los lleva al documento open-accounting; la configuración y la imputación llegan aparte. Luego recorre seis pasos. Uno, preparar: el libro, la configuración del destino y la imputación por id_externo. Dos, revisar, en el núcleo: RUC, IGV, total, fecha y duplicados; un error detiene y un aviso pasa. Tres, seleccionar: quedan fuera los excluidos, los duplicados y lo que el destino no lleva. Cuatro, exigir lo del destino, en el núcleo, si lleva cuentas: cuenta, centro de costo, sigla y lo que no cabe en su formato. Cinco, armar según el destino: un asiento de líneas neutrales numeradas, que cuadran y llevan su huella, que CONCAR y el CSV traducen línea a línea; un registro contable, que CONTASIS recibe con las mismas cuentas; o un registro tributario, una línea por comprobante sin cuentas, que el SIRE escribe como TXT y ZIP. Seis, responder: el archivo, el resumen y cada comprobante con su identidad y su huella. revisar llega hasta el paso dos, diagnosticar recorre hasta el cuatro sin detenerse, generar_asiento llega al asiento y exportar recorre todo.</desc>
<style>
.fondo{fill:#FFFFFF}
.t,.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;font-weight:400}
.g rect{fill:#F1EFE8;stroke:#5F5E5A}.g .t{fill:#444441}.g .s{fill:#5F5E5A}
.v rect{fill:#E1F5EE;stroke:#0F6E56}.v .t{fill:#085041}.v .s{fill:#0F6E56}
.a rect{fill:#E6F1FB;stroke:#185FA5}.a .t{fill:#0C447C}.a .s{fill:#185FA5}
.flecha{stroke:#888780;stroke-width:1.5;fill:none}
.leyenda{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.fondo{fill:#0D1117}
.g rect{fill:#444441;stroke:#B4B2A9}.g .t{fill:#F1EFE8}.g .s{fill:#D3D1C7}
.v rect{fill:#085041;stroke:#5DCAA5}.v .t{fill:#E1F5EE}.v .s{fill:#9FE1CB}
.a rect{fill:#0C447C;stroke:#85B7EB}.a .t{fill:#E6F1FB}.a .s{fill:#B5D4F4}
.leyenda{fill:#B4B2A9}
}
</style>
