<g class="v"><rect x="40" y="452" width="600" height="56" rx="8" stroke-width="0.5"/><text class="t" x="340" y="470">4 · Exigir lo del destino</text><text class="s" x="340" y="488">Si lleva cuentas: cuenta, centro de costo, sigla y lo que no cabe</text></g>
