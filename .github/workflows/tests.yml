name: tests

on:
  push:
    branches: [main]
  pull_request:

# Minimo privilegio: estos trabajos solo leen el codigo. Sin esto, el token del
# workflow nace con permisos de escritura sobre el repositorio.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Las acciones van fijadas por SHA, no por etiqueta: una etiqueta se puede
      # mover y ejecutariamos codigo que nadie reviso.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # Sin red y sin credenciales: si un test necesita cualquiera de las dos, esta mal planteado.
      - run: pytest -q
